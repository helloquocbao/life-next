# nginx trên host 163.61.72.37 → /etc/nginx/sites-available/deathnote-api.nonlastamp.com
# Khởi đầu chỉ có HTTP; chạy `certbot --nginx -d deathnote-api.nonlastamp.com` để certbot tự thêm khối SSL.
server {
    listen 80;
    server_name deathnote-api.nonlastamp.com;

    # Tệp bằng chứng tối đa 10 MB + overhead multipart.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Cookie đăng nhập / header OIDC khá lớn.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
