# nginx trên host 163.61.72.37 → /etc/nginx/sites-available/deathnote-api.nonlastamp.com
# Khởi đầu chỉ có HTTP; chạy `certbot --nginx -d deathnote-api.nonlastamp.com` để certbot tự thêm khối SSL.
#
# Tệp này được include trong khối http{} của /etc/nginx/nginx.conf nên khai báo upstream/limit_req_zone ở đây được.
# Cho ~10.000 user, trong /etc/nginx/nginx.conf nên đặt:
#   worker_processes auto;  worker_rlimit_nofile 65535;  events { worker_connections 8192; }

# Giữ sẵn kết nối tới Kestrel thay vì mở TCP mới cho mỗi request.
upstream lifenext_api {
    server 127.0.0.1:5080;
    keepalive 64;
}

# Chống dò mật khẩu / spam đăng ký: endpoint xác thực chặt hơn API thường (theo IP).
limit_req_zone $binary_remote_addr zone=lifenext_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=lifenext_api:10m  rate=30r/s;

server {
    listen 80;
    server_name deathnote-api.nonlastamp.com;

    # Tệp bằng chứng tối đa 10 MB + overhead multipart.
    client_max_body_size 12m;

    limit_req_status 429;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain;

    # Cookie đăng nhập / header OIDC khá lớn.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";   # bắt buộc để keepalive upstream hoạt động
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Lấy token / đăng nhập / đăng ký.
    location ~ ^/(connect/token|Account/) {
        limit_req zone=lifenext_auth burst=10 nodelay;
        proxy_pass http://lifenext_api;
    }

    location / {
        limit_req zone=lifenext_api burst=60 nodelay;
        proxy_pass http://lifenext_api;
    }
}
